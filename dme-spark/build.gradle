description = 'DME extensions for the Iceberg Spark 3.5 connector'

dependencies {
  implementation project(':iceberg-api')
  implementation project(':iceberg-core')
  implementation project(path: ':iceberg-bundled-guava', configuration: 'shadow')

  compileOnly project(':iceberg-spark:iceberg-spark-3.5_2.12')
  compileOnly project(':iceberg-spark:iceberg-spark-extensions-3.5_2.12')
  compileOnly "org.apache.spark:spark-hive_2.12:${libs.versions.spark35.get()}"

  testImplementation project(path: ':iceberg-core', configuration: 'testArtifacts')
}

test {
  useJUnitPlatform()
}
